services:
  expedition-redis:
    image: redis:7-alpine
    container_name: astral-expedition-redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    restart: unless-stopped
