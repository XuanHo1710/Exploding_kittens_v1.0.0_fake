# Eldoria: Forgotten Wilds — 100% Self-Hosted Local Docker Compose Stack
# Constitution v2.0.0 Principle I:
#   - Primary Persistent DB: 100% Local JSON Files (./data/db)
#   - Ephemeral Runtime Cache: Local Docker Redis (redis:7-alpine, volatile-lru)
#   - Local S3-Compatible Assets & Backups: Local Docker MinIO (minio/minio + minio-init)
#   - ZERO SQL/NoSQL DBMS, ZERO External Cloud Services

services:
  redis:
    image: redis:7-alpine
    container_name: eldoria-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - eldoria_local_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: eldoria-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eldoria_local_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-eldoria_local_secret_key_2026}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - eldoria_local_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: eldoria-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-eldoria_local_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-eldoria_local_secret_key_2026}
      MINIO_BUCKET_ASSETS: ${MINIO_BUCKET_ASSETS:-eldoria-assets}
      MINIO_BUCKET_BACKUPS: ${MINIO_BUCKET_BACKUPS:-eldoria-backups}
    volumes:
      - ./assets:/seed-assets:ro
      - ./tools/docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks:
      - eldoria_local_net
    restart: "no"

  eldoria-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eldoria-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-eldoria_local_dev_jwt_secret_change_me_64hex_0123456789abcdef0123}
      DATA_DB_DIR: /app/data/db
      DATA_BACKUP_DIR: /app/data/backups
      GAME_DATA_DIR: /app/game-data
      ASSETS_DIR: /app/assets
      SIM_TICK_HZ: 20
      SNAPSHOT_HZ: 10
      DIRTY_FLUSH_INTERVAL_MS: 30000
      BACKUP_INTERVAL_HOURS: 6
      DISK_LOW_THRESHOLD_PCT: 15
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "eldoria:"
      ASSET_STORAGE_MODE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-eldoria_local_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-eldoria_local_secret_key_2026}
      MINIO_BUCKET_ASSETS: ${MINIO_BUCKET_ASSETS:-eldoria-assets}
      MINIO_BUCKET_BACKUPS: ${MINIO_BUCKET_BACKUPS:-eldoria-backups}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/db:/app/data/db
      - ./data/backups:/app/data/backups
      - ./game-data:/app/game-data:ro
      - ./assets:/app/assets:ro
    networks:
      - eldoria_local_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  eldoria_local_net:
    driver: bridge
