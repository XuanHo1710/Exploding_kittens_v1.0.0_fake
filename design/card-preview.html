<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu lá bài Mèo Nổ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1b1a;
    --paper: #fffdf7;
    --bg: #f3ece0;
    --text: #2a2622;
    --muted: #7a7166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    padding: 32px 16px 48px;
  }
  h1 { font-family: "Baloo 2", sans-serif; font-size: 34px; margin: 0 0 4px; text-align: center; }
  .lead { text-align: center; color: var(--muted); margin: 0 0 32px; font-size: 14px; }
  .sections { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 56px; max-width: 1180px; margin: 0 auto; }
  section { margin: 0; }
  section h2 { font-family: "Baloo 2", sans-serif; font-size: 22px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

  /* ---------- lá bài (chuẩn tỉ lệ 3:4) ---------- */
  .card {
    width: 240px; height: 320px;
    aspect-ratio: 3 / 4;
    background: var(--paper);
    border-radius: 16px;
    padding: 9px;
    box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 10px 24px rgba(60,40,10,.18);
  }
  .card.photo { padding: 0; overflow: hidden; }
  .card.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame {
    height: 100%;
    border: 4px solid var(--c);
    border-radius: 11px;
    padding: 7px 8px 6px;
    display: flex; flex-direction: column;
  }
  .head { display: flex; align-items: center; gap: 8px; }
  .icon {
    width: 34px; height: 34px; flex: none;
    border-radius: 50%; background: var(--c);
    display: grid; place-items: center;
  }
  .title {
    font-family: "Baloo 2", sans-serif; font-weight: 800;
    font-size: 21px; line-height: 1; color: var(--ink); text-transform: uppercase;
  }
  .flavor { font-size: 10px; color: var(--muted); font-weight: 600; margin: 4px 0 6px; min-height: 13px; }
  .panel {
    flex: 1; min-height: 0;
    background: var(--panel);
    border-radius: 10px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel svg { flex: 1; min-height: 0; width: 100%; display: block; }
  .rule {
    color: #fff; font-size: 10.5px; line-height: 1.35; font-weight: 700;
    text-align: center; padding: 2px 12px 9px;
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  .foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 8.5px; color: var(--muted); padding-top: 4px; font-weight: 600;
  }
  .foot .flip {
    font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 12px; color: var(--ink);
    transform: rotate(180deg); text-transform: uppercase;
  }

  /* bảng màu theo loại lá */
  .t-bomb   { --c: #23201f; --panel: radial-gradient(circle at 50% 40%, #ffb05c, #d9480f 75%); }
  .t-defuse { --c: #2f8f3e; --panel: radial-gradient(circle at 50% 40%, #8fd18a, #2f7d3a 80%); }
  .t-nope   { --c: #d23b2f; --panel: radial-gradient(circle at 50% 40%, #ff8a73, #b3261e 80%); }

  /* mặt sau */
  .back {
    background: #23202e;
    display: grid; place-items: center;
  }
  .back .inner {
    width: 100%; height: 100%;
    border: 3px dashed rgba(255,210,63,.45); border-radius: 11px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: radial-gradient(circle at 50% 42%, #3b3550, #23202e 70%);
  }
  .back .logo { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 40px; color: #ffd23f; letter-spacing: 1px; line-height: 1; }
  .back .sub { font-size: 10px; color: #b8b0d0; letter-spacing: 3px; font-weight: 700; }
</style>
</head>
